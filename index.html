<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabriel's Math Game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
  min-height: 100vh;
  padding: 20px;
  transition: background 1.5s ease;
}
h1 {
  text-align: center;
  font-size: 2.2em;
  color: #c0392b;
  margin-bottom: 10px;
  text-shadow: 2px 2px 0 #fff;
}

/* Score bar */
.score-bar {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.score-item {
  background: white;
  border-radius: 16px;
  padding: 8px 20px;
  font-size: 1.1em;
  font-weight: bold;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  display: flex;
  align-items: center;
  gap: 8px;
}
.score-item .label { color: #888; font-weight: 600; }
.score-item .value { color: #2c3e50; font-size: 1.3em; }
.score-item .value.points { color: #e74c3c; }
.score-item .value.streak { color: #f39c12; }
.score-item .value.level { color: #3498db; }

/* Streak fire animation */
.streak-fire { display: none; }
.streak-fire.active { display: inline; animation: fireFlicker 0.4s ease infinite alternate; }
@keyframes fireFlicker {
  0% { transform: scale(1); }
  100% { transform: scale(1.2) rotate(5deg); }
}

/* Wrong indicators */
.wrong-dots {
  display: flex;
  gap: 6px;
  align-items: center;
}
.wrong-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid #e74c3c;
  background: transparent;
  transition: background 0.3s;
}
.wrong-dot.filled { background: #e74c3c; }

.mode-toggle {
  display: inline-flex;
  justify-content: center;
  margin-bottom: 24px;
  background: #eee;
  border-radius: 10px;
  padding: 3px;
  gap: 0;
}
.mode-opt {
  padding: 8px 18px;
  font-size: 0.9em;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
  background: transparent;
  color: #888;
}
.mode-opt.active { color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.mode-opt.active.mult { background: #e74c3c; }
.mode-opt.active.div  { background: #3498db; }
.mode-opt.active.both { background: #8e44ad; }

.card {
  background: white;
  border-radius: 20px;
  padding: 28px 32px;
  max-width: 820px;
  margin: 0 auto 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}

/* Visual area */
.visual-area {
  background: #fef9f0;
  border-radius: 14px;
  padding: 20px;
  min-height: 100px;
  margin-bottom: 20px;
  border: 2px dashed #f0c080;
}
/* Method picker (break-apart vs column) */
.method-picker {
  display: flex;
  justify-content: center;
  margin-bottom: 0;
  position: relative;
  border-bottom: 2px solid #ddd;
}
.method-picker .method-btn {
  padding: 10px 20px;
  border-radius: 10px 10px 0 0;
  border: 2px solid transparent;
  border-bottom: 2px solid #ddd;
  background: #f0f0f0;
  font-size: 0.9em;
  font-weight: bold;
  cursor: pointer;
  color: #999;
  transition: all 0.2s;
  margin-bottom: -2px;
}
.method-picker .method-btn.active {
  background: white;
  color: #333;
  border-color: #ddd;
  border-bottom-color: white;
}
.method-picker .method-btn:hover:not(.active) {
  background: #e8e8e8;
  color: #666;
}
.method-tab-content {
  padding-top: 16px;
}
.visual-title {
  font-size: 0.9em;
  color: #888;
  margin-bottom: 10px;
  font-style: italic;
}
.groups-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-start;
}
.group {
  background: #fff3e0;
  border-radius: 10px;
  padding: 5px 7px;
  border: 2px solid #ffcc80;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  max-width: 160px;
}
.item { font-size: 1.2em; line-height: 1; }
.too-many {
  font-size: 1em;
  color: #999;
  font-style: italic;
  padding: 10px;
}

/* Break-apart visualization */
.break-apart {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 0;
  width: 100%;
}
.break-part {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.break-label {
  font-size: 0.9em;
  font-weight: bold;
  color: #555;
}
.break-bar {
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-weight: bold;
  font-size: 0.85em;
  color: white;
  min-width: 36px;
}
.break-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.break-input {
  width: 80px;
  font-size: 1.1em;
  font-weight: bold;
  text-align: center;
  border: 2px solid #bdc3c7;
  border-radius: 10px;
  padding: 5px 8px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  color: #2c3e50;
}
.break-input:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.15); }
.break-input.correct { border-color: #27ae60; box-shadow: 0 0 0 3px rgba(39,174,96,0.2); background: #eafaf1; }
.break-input.wrong { border-color: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,0.15); }
.break-check-btn {
  background: #7f8c8d;
  color: white;
  border: none;
  padding: 6px 14px;
  font-size: 0.85em;
  border-radius: 16px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
}
.break-check-btn:hover { background: #6c7a7d; transform: scale(1.04); }
.break-result {
  font-weight: bold;
  font-size: 0.95em;
  color: #888;
  display: none;
}
.break-result.visible { display: inline; }
.break-total {
  border-top: 2px dashed #ccc;
  padding-top: 10px;
  margin-top: 4px;
}
.break-total .break-label { color: #27ae60; font-size: 1em; }

/* Interactive column table digit inputs */
.digit-input {
  width: 36px;
  height: 36px;
  text-align: center;
  font-size: 1.2em;
  font-weight: bold;
  font-family: 'Courier New', monospace;
  border: 2px solid #bdc3c7;
  border-radius: 6px;
  outline: none;
  padding: 0;
  color: #2c3e50;
  background: #fff;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  -moz-appearance: textfield;
}
/* Pulsing glow on the next input to fill */
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 3px rgba(52,152,219,0.25); }
  50% { box-shadow: 0 0 0 5px rgba(52,152,219,0.45); }
}
.digit-input.next-focus:not(.correct) {
  border-color: #3498db;
  animation: pulseGlow 1.2s ease-in-out infinite;
}
.digit-input::-webkit-inner-spin-button,
.digit-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.digit-input:focus { border-color: #3498db; box-shadow: 0 0 0 2px rgba(52,152,219,0.2); }
.digit-input.correct { border-color: #27ae60; background: #eafaf1; color: #27ae60; box-shadow: 0 0 8px rgba(39,174,96,0.35); }
.digit-input.wrong { border-color: #e74c3c; background: #fdf0ef; }
.digit-input:disabled { background: #f0f0f0; border-color: #ddd; color: #bbb; cursor: not-allowed; }
.col-table td.input-cell { padding: 2px; }
.working-detail-toggle {
  background: none;
  border: none;
  color: #3498db;
  cursor: pointer;
  font-size: 0.85em;
  padding: 2px 0;
  margin-top: 4px;
  font-weight: bold;
}
.working-detail-toggle:hover { color: #2980b9; text-decoration: underline; }
.working-detail { display: none; margin-top: 6px; }
.working-detail.visible { display: block; }
.working-total {
  border-top: 2px dashed #ccc;
  padding-top: 10px;
  margin-top: 8px;
}
.working-total .step-title { color: #27ae60; }
.col-table .hidden-row td { visibility: hidden; }
.col-table .revealed-row td { visibility: visible; }
.carry-val { opacity: 0; transition: opacity 0.3s ease; display: inline-block; }
.carry-val.visible { opacity: 1; animation: carryPop 0.35s ease; }
@keyframes carryPop {
  0% { opacity: 0; transform: translateY(4px) scale(0.7); }
  60% { transform: translateY(-2px) scale(1.1); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.row-complete td .digit-input { border-color: #27ae60; background: #eafaf1; color: #27ae60; }
/* Color-coded multiplier digit badges */
.digit-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-weight: bold;
  color: white;
  font-size: 1em;
}
/* Partial row color indicator dot */
.partial-dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}
/* Step section colored left border inherits from partial color */
.step-section[data-color] { border-left-width: 5px; }

/* Apple grid for medium numbers */
.apple-grid {
  display: grid;
  gap: 1px;
  justify-content: start;
}
.apple-grid .item { font-size: 0.95em; line-height: 1; text-align: center; }

/* Answer area */
.answer-area {
  text-align: center;
  margin-top: 8px;
}
.answer-area .equation {
  font-size: 2em;
  font-weight: bold;
  color: #2c3e50;
  margin-bottom: 12px;
}

/* Answer input */
.answer-input-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 14px;
}
.answer-input {
  font-size: 1.8em;
  font-weight: bold;
  width: 160px;
  text-align: center;
  border: 3px solid #bdc3c7;
  border-radius: 14px;
  padding: 8px 12px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  color: #2c3e50;
}
.answer-input:focus { border-color: #3498db; box-shadow: 0 0 0 4px rgba(52,152,219,0.15); }
.answer-input.correct { border-color: #27ae60; box-shadow: 0 0 0 4px rgba(39,174,96,0.2); }
.answer-input.wrong { border-color: #e74c3c; box-shadow: 0 0 0 4px rgba(231,76,60,0.15); }

.check-btn {
  background: #27ae60;
  color: white;
  border: none;
  padding: 12px 32px;
  font-size: 1.1em;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
}
.check-btn:hover { background: #219150; transform: scale(1.04); }

.feedback-msg {
  font-size: 1.2em;
  font-weight: bold;
  min-height: 2em;
  margin-bottom: 8px;
  transition: all 0.3s;
}
.feedback-msg.success { color: #27ae60; }
.feedback-msg.tryagain { color: #e67e22; }

.reveal-btn {
  background: #95a5a6;
  color: white;
  border: none;
  padding: 8px 24px;
  font-size: 0.9em;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
  opacity: 0.7;
  display: none;
}
.reveal-btn.visible { display: inline-block; }
.reveal-btn:hover { background: #7f8c8d; opacity: 1; transform: scale(1.04); }

.next-btn {
  background: #3498db;
  color: white;
  border: none;
  padding: 12px 36px;
  font-size: 1.1em;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
  display: none;
  margin-top: 12px;
}
.next-btn.visible { display: inline-block; animation: nextBtnEntry 0.5s ease forwards; }
.next-btn.pulsing { animation: nextBtnPulse 1.5s ease-in-out infinite; }
.next-btn:hover { background: #2980b9; }
@keyframes nextBtnEntry {
  0%   { transform: scale(0); opacity: 0; }
  60%  { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes nextBtnPulse {
  0%, 100% { box-shadow: 0 4px 15px rgba(52,152,219,0.3); filter: brightness(1); }
  50%      { box-shadow: 0 6px 35px rgba(52,152,219,0.7), 0 0 12px rgba(52,152,219,0.4); filter: brightness(1.12); }
}

.answer-box {
  display: none;
  margin-top: 14px;
  font-size: 2.2em;
  font-weight: bold;
  color: #e74c3c;
  animation: pop 0.3s ease;
}
@keyframes pop {
  0%   { transform: scale(0.5); opacity: 0; }
  70%  { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

/* Bonus popup */
.bonus-popup {
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 2.5em;
  font-weight: 900;
  color: #f39c12;
  text-shadow: 3px 3px 0 #fff, 0 0 20px rgba(243,156,18,0.4);
  z-index: 10001;
  pointer-events: none;
  animation: bonusPop 2s ease forwards;
}
@keyframes bonusPop {
  0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  15%  { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  30%  { transform: translate(-50%, -50%) scale(1); }
  70%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1) translateY(-40px); opacity: 0; }
}

/* Points fly animation */
.points-fly {
  position: fixed;
  font-size: 1.8em;
  font-weight: 900;
  color: #27ae60;
  z-index: 10000;
  pointer-events: none;
  animation: pointsFly 1.2s ease-out forwards;
}
@keyframes pointsFly {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-80px) scale(0.5); }
}

/* Celebration text */
.celebration-text {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 4em;
  font-weight: 900;
  color: #27ae60;
  text-shadow: 3px 3px 0 #fff, 0 0 20px rgba(39,174,96,0.4);
  z-index: 10000;
  pointer-events: none;
  animation: celebPop 1.2s ease forwards;
}
@keyframes celebPop {
  0%   { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
  20%  { transform: translate(-50%, -50%) scale(1.4) rotate(3deg); opacity: 1; }
  40%  { transform: translate(-50%, -50%) scale(0.95) rotate(-2deg); }
  60%  { transform: translate(-50%, -50%) scale(1.1) rotate(1deg); }
  80%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0; }
}

/* Confetti particle */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  z-index: 9999;
  pointer-events: none;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.3); }
}

/* Stars burst */
.star-burst {
  position: fixed;
  font-size: 2em;
  z-index: 10000;
  pointer-events: none;
  animation: starFloat 1.5s ease-out forwards;
}
@keyframes starFloat {
  0%   { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
  50%  { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(180deg); }
  100% { opacity: 0; transform: translate(var(--dx2), var(--dy2)) scale(0.3) rotate(360deg); }
}

/* Wrong answer shake */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-12px); }
  40% { transform: translateX(12px); }
  60% { transform: translateX(-8px); }
  80% { transform: translateX(8px); }
}
.shake { animation: shake 0.4s ease; }

/* Level-up overlay */
.level-up-overlay {
  position: fixed; inset: 0; z-index: 20001; pointer-events: none;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
}
.level-up-shatter {
  position: fixed; z-index: 20002; pointer-events: none;
  font-weight: 900; font-size: 2em;
  animation: shatterPiece 1.2s ease-out forwards;
}
@keyframes shatterPiece {
  0%   { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.2); }
}
.level-up-text {
  font-size: 3.5em; font-weight: 900; color: white;
  text-shadow: 0 0 30px rgba(0,0,0,0.3), 0 4px 0 rgba(0,0,0,0.15);
  z-index: 20003; pointer-events: none; position: fixed;
  top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
  animation: levelUpPop 2s ease forwards;
}
@keyframes levelUpPop {
  0%   { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
  15%  { transform: translate(-50%, -50%) scale(1.5) rotate(3deg); opacity: 1; }
  30%  { transform: translate(-50%, -50%) scale(1.1) rotate(-1deg); }
  50%  { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 1; }
  80%  { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.2) translateY(-30px); opacity: 0; }
}
.level-up-flash {
  position: fixed; inset: 0; z-index: 20000; pointer-events: none;
  animation: levelFlash 1.5s ease forwards;
}
@keyframes levelFlash {
  0%   { opacity: 0; }
  10%  { opacity: 0.8; }
  40%  { opacity: 0.4; }
  100% { opacity: 0; }
}

/* Correct digit pop */
@keyframes digitPop {
  0%   { transform: scale(1); box-shadow: 0 0 0 rgba(39,174,96,0); }
  30%  { transform: scale(1.35); box-shadow: 0 0 18px rgba(39,174,96,0.6); }
  60%  { transform: scale(0.92); }
  80%  { transform: scale(1.05); }
  100% { transform: scale(1); box-shadow: 0 0 8px rgba(39,174,96,0.35); }
}
.digit-pop { animation: digitPop 0.4s ease; }

/* Row complete sweep */
@keyframes rowSweep {
  0%   { background-position: -100% 0; }
  100% { background-position: 200% 0; }
}
.row-complete {
  animation: rowCelebrate 0.6s ease;
}
@keyframes rowCelebrate {
  0%   { filter: brightness(1); }
  30%  { filter: brightness(1.3); }
  60%  { filter: brightness(1.1); }
  100% { filter: brightness(1); }
}

/* Steps toggle */
.steps-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  cursor: pointer;
  color: #555;
  font-size: 1em;
  font-weight: bold;
  user-select: none;
}
.steps-toggle input { cursor: pointer; accent-color: #3498db; width: 18px; height: 18px; }
.steps-area { display: none; }
.steps-area.visible { display: block; }

/* Column layout table */
.mult-workings { font-family: 'Courier New', monospace; font-size: 1.05em; }
.col-table {
  border-collapse: collapse;
  margin: 0 auto 20px;
  font-family: 'Courier New', monospace;
  font-size: 1.25em;
}
.col-table td {
  width: 38px; height: 38px;
  text-align: center; vertical-align: middle; padding: 0;
}
.col-table td.op-cell {
  width: 44px; color: #888; font-weight: bold;
  text-align: right; padding-right: 6px;
}
.col-table .carry-row td { height: 22px; font-size: 0.75em; color: #e67e22; font-weight: bold; vertical-align: bottom; }
.col-table .sep-row td { border-top: 3px solid #555; height: 6px; }
.col-table .sep-row td.op-cell { border-top: none; }
.col-table .result-row td { color: #27ae60; font-weight: bold; }
.col-table .partial-row td { }
.col-table td.dim { color: #bbb; }

/* Responsive column table for mobile */
#workings {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
@media (max-width: 520px) {
  .col-table { font-size: 1em; }
  .col-table td { width: 28px; height: 28px; }
  .col-table td.op-cell { width: 30px; padding-right: 3px; font-size: 0.85em; }
  .col-table .carry-row td { height: 18px; font-size: 0.65em; }
  .digit-input { width: 26px; height: 26px; font-size: 1em; border-width: 1.5px; border-radius: 4px; }
  .digit-badge { width: 20px; height: 20px; font-size: 0.8em; }
  .partial-dot { width: 8px; height: 8px; }
}
@media (max-width: 380px) {
  .col-table { font-size: 0.85em; }
  .col-table td { width: 24px; height: 24px; }
  .col-table td.op-cell { width: 26px; padding-right: 2px; font-size: 0.75em; }
  .col-table .carry-row td { height: 16px; font-size: 0.6em; }
  .digit-input { width: 22px; height: 22px; font-size: 0.9em; border-width: 1.5px; border-radius: 3px; }
  .digit-badge { width: 18px; height: 18px; font-size: 0.7em; }
  .partial-dot { width: 6px; height: 6px; }
}

.step-section {
  background: #f8f8ff; border-left: 4px solid #e74c3c;
  border-radius: 0 10px 10px 0; padding: 14px 18px; margin-bottom: 14px;
}
.step-section.add-section { border-left-color: #27ae60; }
.step-title { font-weight: bold; color: #333; margin-bottom: 10px; font-size: 1.05em; }
.digit-steps { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; padding-left: 10px; }
.digit-step { color: #555; font-family: 'Courier New', monospace; font-size: 0.98em; }
.carry-num { background: #e67e22; color: white; border-radius: 4px; padding: 1px 5px; font-size: 0.85em; font-weight: bold; margin: 0 2px; }
.partial-result { font-size: 1.1em; font-weight: bold; color: #2980b9; margin-top: 6px; padding-left: 10px; }
.place-note { color: #999; font-weight: normal; font-size: 0.88em; }

/* Long division workings */
.div-workings {
  font-family: 'Courier New', monospace; font-size: 1.05em;
  background: #f8f8ff; border-radius: 14px; padding: 20px 24px;
  border: 2px solid #d0d0ff; white-space: pre; line-height: 2; overflow-x: auto;
}
.div-workings .step { color: #555; }
.div-workings .result-line { color: #27ae60; font-weight: bold; }
.div-workings .line-sep { color: #bbb; }

/* Difficulty badge */
.difficulty-badge {
  text-align: center;
  margin-bottom: 8px;
  font-size: 0.85em;
  color: #888;
}

/* Start screen overlay */
.start-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
  z-index: 20000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.start-screen.hidden { display: none; }
.start-card {
  background: white;
  border-radius: 24px;
  padding: 40px 36px;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 12px 48px rgba(0,0,0,0.15);
  text-align: center;
}
.start-card h2 {
  font-size: 1.8em;
  color: #c0392b;
  margin-bottom: 8px;
}
.start-card .start-subtitle {
  color: #888;
  font-size: 1em;
  margin-bottom: 24px;
}
.level-picker {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 28px;
}
.level-pick-btn {
  border: 3px solid #ddd;
  background: #fafafa;
  border-radius: 14px;
  padding: 12px 8px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.level-pick-btn:hover { border-color: #bbb; background: #f0f0f0; }
.level-pick-btn.selected {
  border-color: #3498db;
  background: #ebf5fb;
  transform: scale(1.05);
  box-shadow: 0 3px 12px rgba(52,152,219,0.25);
}
.level-pick-btn .lvl-num {
  font-size: 1.6em;
  font-weight: 900;
  color: #2c3e50;
  display: block;
}
.level-pick-btn .lvl-label {
  font-size: 0.75em;
  font-weight: bold;
  color: #888;
  display: block;
  margin-top: 2px;
}
.level-pick-btn .lvl-range {
  font-size: 0.65em;
  color: #aaa;
  display: block;
  margin-top: 2px;
}
.start-game-btn {
  background: #27ae60;
  color: white;
  border: none;
  padding: 16px 48px;
  font-size: 1.3em;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.2s;
}
.start-game-btn:hover { background: #219150; transform: scale(1.05); }

/* Language picker */
.lang-picker {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}
.lang-btn {
  padding: 6px 16px;
  font-size: 0.9em;
  border: 2px solid #ddd;
  border-radius: 20px;
  cursor: pointer;
  background: #fafafa;
  font-weight: bold;
  transition: all 0.2s;
}
.lang-btn.active {
  border-color: #3498db;
  background: #ebf5fb;
}
.lang-btn:hover { border-color: #bbb; }

/* Best streak footer */
.best-streak-bar {
  text-align: center;
  margin: 0 auto;
  max-width: 820px;
  padding: 14px 20px;
  font-size: 1.1em;
  font-weight: bold;
  color: #f39c12;
  background: rgba(255,255,255,0.6);
  border-radius: 16px;
}
.best-streak-bar span {
  font-size: 1.3em;
  color: #e67e22;
}

</head>

let lang = 'en';
function t(key) { return TRANSLATIONS[lang][key] || TRANSLATIONS.en[key] || key; }

/* ───────── GAME STATE ───────── */
let mode = 'mult';
let questionMode = 'mult';
let score = 0;
let streak = 0;
let level = 1;
let wrongCount = 0;
let answered = false;
let questionsAnswered = 0;
let bestStreak = 0;
let startingLevel = 1;
let currentA = 0;
let currentB = 0;
let helpMethod = 'column'; // 'break' or 'column'

/* ───────── HELP METHOD PICKER ───────── */
function setMethod(method) {
  helpMethod = method;
  document.getElementById('methodBreakBtn').classList.toggle('active', method === 'break');
  document.getElementById('methodColBtn').classList.toggle('active', method === 'column');
  document.getElementById('methodBreakContent').style.display = method === 'break' ? '' : 'none';
  document.getElementById('methodColumnContent').style.display = method === 'column' ? '' : 'none';
}

/* ───────── LANGUAGE ───────── */
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');
  applyTranslations();
}

function applyTranslations() {
  // Start screen
  document.getElementById('startTitle').textContent = t('title');
  document.getElementById('startSubtitle').textContent = t('chooseLevel');
  document.getElementById('startGameBtn').textContent = t('startGame');
  // Level picker labels
  const levelLabels = ['easy','easy','medium','medium','hard','hard','expert','expert','master','master','champion','champion'];
  document.querySelectorAll('.level-pick-btn .lvl-label').forEach((el, i) => {
    el.textContent = t(levelLabels[i]);
  });
  // Main game UI
  document.getElementById('mainTitle').textContent = t('title');
  document.getElementById('labelScore').textContent = t('score');
  document.getElementById('labelStreak').textContent = t('streak');

}

/* ───────── DIFFICULTY / QUESTION GENERATION ───────── */
const LEVEL_CONFIGS = [
  { minA: 1, maxA: 5,  minB: 1, maxB: 5,  label: 'Easy' },
  { minA: 2, maxA: 7,  minB: 2, maxB: 7,  label: 'Easy' },
  { minA: 2, maxA: 9,  minB: 2, maxB: 9,  label: 'Medium' },
  { minA: 2, maxA: 12, minB: 2, maxB: 12, label: 'Medium' },
  { minA: 5, maxA: 15, minB: 2, maxB: 12, label: 'Hard' },
  { minA: 10, maxA: 25, minB: 2, maxB: 15, label: 'Hard' },
  { minA: 10, maxA: 50, minB: 2, maxB: 20, label: 'Expert' },
  { minA: 10, maxA: 99, minB: 2, maxB: 50, label: 'Expert' },
  { minA: 100, maxA: 250, minB: 10, maxB: 50, label: 'Master' },
  { minA: 100, maxA: 500, minB: 10, maxB: 99, label: 'Master' },
  { minA: 500, maxA: 2000, minB: 20, maxB: 99, label: 'Champion' },
  { minA: 1000, maxA: 9999, minB: 20, maxB: 999, label: 'Champion' },
];

function getLevelConfig(lvl) {
  return LEVEL_CONFIGS[Math.min(lvl - 1, LEVEL_CONFIGS.length - 1)];
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateQuestion() {
  const cfg = getLevelConfig(level);

  // Pick the actual operation for this question
  if (mode === 'both') {
    questionMode = Math.random() > 0.5 ? 'mult' : 'div';
  } else {
    questionMode = mode;
  }

  if (questionMode === 'mult') {
    currentA = randInt(cfg.minA, cfg.maxA);
    currentB = randInt(cfg.minB, cfg.maxB);
    // Randomly swap so it's not always big × small
    if (Math.random() > 0.5) { const t = currentA; currentA = currentB; currentB = t; }
  } else {
    // For division: generate a × b, then ask (a*b) ÷ b = a (so it divides evenly)
    const a = randInt(cfg.minA, cfg.maxA);
    const b = randInt(cfg.minB, cfg.maxB);
    currentA = a * b;  // dividend
    currentB = b;      // divisor
  }

  wrongCount = 0;
  answered = false;
  updateWrongDots();
  resetAnswerState();
  document.getElementById('revealBtn').classList.remove('visible');
  document.getElementById('nextBtn').classList.remove('visible', 'pulsing');
  document.getElementById('difficultyBadge').textContent =
    t('levelBadge').replace('{level}', level).replace('{label}', t(getLevelConfig(level).label.toLowerCase()));
  renderQuestion();
  document.getElementById('answerInput').focus();
}

function renderQuestion() {
  if (questionMode === 'mult') renderMultiplication(currentA, currentB);
  else renderDivision(currentA, currentB);
  if (document.getElementById('stepsToggle').checked)
    document.getElementById('stepsArea').classList.add('visible');
}

/* ───────── SCORING ───────── */
function addPoints(pts) {
  score += pts;
  document.getElementById('scoreDisplay').textContent = score;

  // Fly +N animation
  const fly = document.createElement('div');
  fly.className = 'points-fly';
  fly.textContent = '+' + pts;
  fly.style.left = '50%';
  fly.style.top = '45%';
  document.body.appendChild(fly);
  setTimeout(() => fly.remove(), 1300);
}

function updateStreak() {
  if (streak > bestStreak) {
    bestStreak = streak;
    document.getElementById('bestStreakValue').textContent = bestStreak;
  }
  document.getElementById('streakDisplay').textContent = streak;
  const fire = document.getElementById('streakFire');
  fire.classList.toggle('active', streak >= 3);
}

const levelGradients = [
  'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', // 1: warm peach (default)
  'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', // 2: warm peach
  'linear-gradient(135deg, #e0f7fa 0%, #80deea 100%)', // 3: sky blue
  'linear-gradient(135deg, #e8f5e9 0%, #a5d6a7 100%)', // 4: fresh green
  'linear-gradient(135deg, #fff3e0 0%, #ffcc80 100%)', // 5: amber
  'linear-gradient(135deg, #fce4ec 0%, #f48fb1 100%)', // 6: rose
  'linear-gradient(135deg, #ede7f6 0%, #b39ddb 100%)', // 7: lavender
  'linear-gradient(135deg, #e3f2fd 0%, #64b5f6 100%)', // 8: ocean blue
  'linear-gradient(135deg, #f3e5f5 0%, #ce93d8 100%)', // 9: purple mist
  'linear-gradient(135deg, #e8eaf6 0%, #7986cb 100%)', // 10: indigo
  'linear-gradient(135deg, #fff8e1 0%, #ffd54f 100%)', // 11: golden
  'linear-gradient(135deg, #fbe9e7 0%, #ff8a65 100%)', // 12: fire
];
function updateLevel() {
  document.getElementById('levelDisplay').textContent = level;
  document.body.style.background = levelGradients[Math.min(level - 1, levelGradients.length - 1)];
}

function updateWrongDots() {
  for (let i = 0; i < 3; i++) {
    document.getElementById('dot' + i).classList.toggle('filled', i < wrongCount);
  }
}

function calculateLevel() {
  // Level up every 5 correct answers, but never below starting level
  const newLevel = Math.min(Math.max(Math.floor(questionsAnswered / 5) + startingLevel, startingLevel), LEVEL_CONFIGS.length);
  if (newLevel !== level) {
    const oldLevel = level;
    level = newLevel;
    updateLevel();
    if (newLevel > oldLevel) launchLevelUp(newLevel);
  }
}

function launchLevelUp(lvl) {
  const colors = celebColors;
  // 1. Flash the new level's color
  const bg = levelGradients[Math.min(lvl - 1, levelGradients.length - 1)];
  const flash = document.createElement('div');
  flash.className = 'level-up-flash';
  // Extract the end color from gradient for the flash
  const match = bg.match(/#[a-f0-9]{6}/gi);
  flash.style.background = `radial-gradient(circle, ${match ? match[1] : '#fff'} 0%, transparent 70%)`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 1600);

  // 2. Shatter effect — pieces fly outward from center
  const shatterEmojis = ['🎯','🏆','⬆️','🔥','💪','🌟','✨','🎉','🚀','💥'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'level-up-shatter';
    p.textContent = shatterEmojis[Math.floor(Math.random() * shatterEmojis.length)];
    const angle = (i / 20) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
    const dist = 150 + Math.random() * 250;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist - 100 + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    p.style.left = '50%'; p.style.top = '50%';
    p.style.color = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * 0.2 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }

  // 3. Big "LEVEL UP!" text
  const text = document.createElement('div');
  text.className = 'level-up-text';
  const label = t(getLevelConfig(lvl).label.toLowerCase());
  text.innerHTML = `${t('levelUp')}<br><span style="font-size:0.5em">${t('level')} ${lvl} — ${label}</span>`;
  document.body.appendChild(text);
  setTimeout(() => text.remove(), 2500);

  // 4. Massive confetti burst
  showConfetti(120);
}

/* ───────── START SCREEN ───────── */
function pickLevel(lvl, btn) {
  startingLevel = lvl;
  document.querySelectorAll('.level-pick-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function startGame() {
  level = startingLevel;
  updateLevel();
  document.getElementById('startScreen').classList.add('hidden');
  generateQuestion();
}

/* ───────── MODE SWITCHING ───────── */
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-opt').forEach(b => b.classList.remove('active'));
  document.querySelector('.mode-opt.' + m).classList.add('active');
  generateQuestion();
}

/* ───────── ANSWER CHECKING ───────── */
function getCorrectAnswer() {
  if (questionMode === 'mult') return currentA * currentB;
  return Math.floor(currentA / currentB);
}

function checkAnswer() {
  if (answered) return;
  const input = document.getElementById('answerInput');
  const feedback = document.getElementById('feedbackMsg');
  const userAnswer = parseInt(input.value);
  const correct = getCorrectAnswer();

  if (isNaN(userAnswer)) {
    input.focus();
    return;
  }

  if (userAnswer === correct) {
    answered = true;
    input.classList.remove('wrong');
    input.classList.add('correct');
    input.readOnly = true;
    feedback.className = 'feedback-msg success';
    feedback.textContent = '';

    // Points: 10 base points
    let pts = 10;
    streak++;

    // Streak bonus: 10 extra points for every 10 correct in a row
    if (streak > 0 && streak % 10 === 0) {
      pts += 10;
      setTimeout(() => {
        const bonus = document.createElement('div');
        bonus.className = 'bonus-popup';
        bonus.textContent = t('streakBonus');
        document.body.appendChild(bonus);
        setTimeout(() => bonus.remove(), 2500);
      }, 600);
    }

    addPoints(pts);
    updateStreak();
    questionsAnswered++;
    calculateLevel();
    launchCelebration();

    // Show next button after celebration
    setTimeout(() => {
      const nb = document.getElementById('nextBtn');
      nb.classList.add('visible');
      setTimeout(() => nb.classList.add('pulsing'), 500);
    }, 800);

  } else {
    wrongCount++;
    streak = 0;
    updateStreak();
    updateWrongDots();
    input.classList.remove('correct');
    input.classList.add('wrong');
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    input.value = '';

    feedback.className = 'feedback-msg tryagain';

    if (wrongCount >= 3) {
      // After 3 wrong: show reveal button
      feedback.textContent = t('threeWrong');
      document.getElementById('revealBtn').classList.add('visible');
    } else {
      const encouragements = t('encouragements');
      feedback.textContent = encouragements[Math.floor(Math.random() * encouragements.length)];
      feedback.textContent += ' ' + t('triesRemaining').replace('{n}', 3 - wrongCount);
    }

    input.focus();
  }
}

function revealAnswer() {
  answered = true;
  const correct = getCorrectAnswer();
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('answerInput').readOnly = true;
  document.getElementById('checkBtn').style.display = 'none';
  document.getElementById('revealBtn').classList.remove('visible');
  document.getElementById('feedbackMsg').textContent = '';

  // Show next button
  const nb = document.getElementById('nextBtn');
  nb.classList.add('visible');
  setTimeout(() => nb.classList.add('pulsing'), 500);
}

function nextQuestion() {
  document.getElementById('checkBtn').style.display = '';
  document.getElementById('answerBox').style.display = 'none';
  generateQuestion();
}

function toggleSteps() {
  const area = document.getElementById('stepsArea');
  area.classList.toggle('visible', document.getElementById('stepsToggle').checked);
}

function resetAnswerState() {
  const input = document.getElementById('answerInput');
  const feedback = document.getElementById('feedbackMsg');
  input.value = '';
  input.readOnly = false;
  input.classList.remove('correct', 'wrong', 'shake');
  feedback.textContent = '';
  feedback.className = 'feedback-msg';
}

/* ───────── MULTIPLICATION ───────── */
function renderMultiplication(a, b) {
  const total = a * b;
  document.getElementById('equation').textContent = `${a} × ${b} = ?`;
  document.getElementById('answerBox').textContent = `= ${total.toLocaleString()}`;

  // Show method picker only for large numbers (where break-apart is used)
  const isLarge = !(total <= 50 && a <= 10 && b <= 10) && !(total <= 144 && a <= 12 && b <= 12);
  const picker = document.getElementById('methodPicker');
  picker.style.display = isLarge ? '' : 'none';

  // Hide division workings card
  document.getElementById('divWorkingsCard').style.display = 'none';

  // Always render visual (break-apart / apples)
  renderVisualMult(a, b, total);

  if (isLarge) {
    // Render column method content
    document.getElementById('workings').innerHTML = buildMultWorkings(a, b);
    // Restore method selection
    setMethod(helpMethod);
  } else {
    // Small/medium: just show the visual, hide column content
    document.getElementById('methodBreakContent').style.display = '';
    document.getElementById('methodColumnContent').style.display = 'none';
  }
}

function renderVisualMult(a, b, total) {
  const container = document.getElementById('groupsContainer');
  container.innerHTML = '';

  if (total <= 50 && a <= 10 && b <= 10) {
    // Small numbers: show apple groups
    document.getElementById('visualTitle').textContent =
      t('groupsOf').replace('{a}', a).replace('{s}', a>1?'s':'').replace('{s_sv}', a>1?'er':'').replace('{b}', b);
    for (let g = 0; g < a; g++) {
      const div = document.createElement('div');
      div.className = 'group';
      for (let i = 0; i < b; i++) {
        const s = document.createElement('span');
        s.className = 'item'; s.textContent = '🍎';
        div.appendChild(s);
      }
      container.appendChild(div);
    }
  } else if (total <= 144 && a <= 12 && b <= 12) {
    // Medium numbers: show a neat grid of apples (rows × columns)
    document.getElementById('visualTitle').textContent =
      t('rowsCols').replace('{a}', a).replace('{b}', b);
    const grid = document.createElement('div');
    grid.className = 'apple-grid';
    grid.style.gridTemplateColumns = `repeat(${b}, 1fr)`;
    for (let i = 0; i < a * b; i++) {
      const s = document.createElement('span');
      s.className = 'item'; s.textContent = '🍎';
      grid.appendChild(s);
    }
    container.appendChild(grid);
  } else {
    // Large numbers: break-apart strategy
    // Break the bigger number into easy parts
    // e.g. 24 × 13 → 24×10 + 24×3
    // Bars are proportional to the total, so parts visually add up
    // Don't show the total — the child has to figure that out!
    const parts = breakApart(a, b);
    const barColors = ['#e74c3c', '#3498db', '#9b59b6', '#e67e22', '#1abc9c'];

    document.getElementById('visualTitle').textContent = '';

    let html = '<div class="break-apart">';
    parts.forEach((p, i) => {
      const color = barColors[i % barColors.length];
      html += `<div class="break-part">
        <span class="break-label">${a} × ${p.factor} = </span>
        <div class="break-input-row">
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="break-input" id="subInput${i}" data-answer="${p.value}" data-index="${i}" data-color="${color}" placeholder="?" onkeydown="if(event.key==='Enter')checkSubProblem(${i})">
          <button class="break-check-btn" onclick="checkSubProblem(${i})">Check</button>
          <span class="break-result" id="subResult${i}"></span>
        </div>
        <div class="break-bar" id="subBar${i}" style="width:0%;background:${color};display:none;"></div>
      </div>`;
    });
    // Hint row: updates as sub-problems are solved
    html += `<div class="break-total" id="breakTotal">
      <span class="break-label" id="breakTotalLabel">${t('solvePartsHint')}</span>
    </div>`;
    html += '</div>';
    container.innerHTML = html;
  }
}

function checkSubProblem(index) {
  const input = document.getElementById('subInput' + index);
  const result = document.getElementById('subResult' + index);
  const bar = document.getElementById('subBar' + index);
  const correctVal = parseInt(input.dataset.answer);
  const userVal = parseInt(input.value);
  const color = input.dataset.color;

  if (isNaN(userVal)) { input.focus(); return; }

  if (userVal === correctVal) {
    input.classList.remove('wrong');
    input.classList.add('correct');
    input.readOnly = true;
    result.textContent = correctVal;
    result.classList.add('visible');
    result.style.color = '#27ae60';

    // Show the bar with correct proportional width
    const total = currentA * currentB;
    const widthPct = Math.max((correctVal / total) * 100, 5);
    bar.style.display = 'flex';
    bar.style.width = widthPct + '%';
    bar.textContent = correctVal;

    // Update the total hint if all sub-problems are solved
    updateBreakTotal();
  } else {
    input.classList.remove('correct');
    input.classList.add('wrong');
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    input.value = '';
    result.textContent = t('tryAgain');
    result.classList.add('visible');
    result.style.color = '#e74c3c';
    input.focus();
  }
}

function updateBreakTotal() {
  const allInputs = document.querySelectorAll('.break-input');
  const solved = [];
  let allDone = true;
  allInputs.forEach(inp => {
    if (inp.classList.contains('correct')) {
      solved.push(parseInt(inp.dataset.answer));
    } else {
      allDone = false;
    }
  });

  const label = document.getElementById('breakTotalLabel');
  if (allDone && solved.length > 0) {
    const sumExpr = solved.join(' + ');
    label.textContent = sumExpr + ' = ?';
  } else if (solved.length > 0) {
    label.textContent = t('keepGoing');
  }
}

function breakApart(a, b) {
  // Break b into place-value parts: 13 → [10, 3], 245 → [200, 40, 5]
  const bStr = String(b);
  const parts = [];
  for (let i = 0; i < bStr.length; i++) {
    const digit = parseInt(bStr[i]);
    if (digit === 0) continue;
    const placeValue = digit * Math.pow(10, bStr.length - 1 - i);
    parts.push({ factor: placeValue, value: a * placeValue });
  }
  return parts;
}

/* ───────── LONG MULTIPLICATION WORKINGS ───────── */
function buildMultWorkings(a, b) {
  const aStr = String(a);
  const bStr = String(b);
  const total = a * b;
  const totalStr = String(total);
  const numCols = totalStr.length;
  const isMultiDigit = bStr.length > 1;

  // Colors for linking multiplier digits to their partial product rows
  const partialColors = ['#e74c3c', '#3498db', '#9b59b6', '#e67e22', '#1abc9c'];
  // Map: for each partialIdx, which column in the multiplier row does it correspond to?
  // partialIdx 0 → rightmost digit of b → column numCols-1
  // partialIdx 1 → second from right → column numCols-2, etc.
  function bDigitCol(pIdx) { return numCols - 1 - pIdx; }

  function makeColTable(rows, interactive) {
    let html = '<table class="col-table">';
    let partialIdx = 0;
    rows.forEach(row => {
      if (row.type === 'sep') {
        const id = row.sepId || '';
        const hideClass = interactive && id ? ' hidden-row' : '';
        html += `<tr class="sep-row${hideClass}" ${id ? 'id="'+id+'"' : ''}><td class="op-cell"></td>`;
        for (let c = 0; c < numCols; c++) html += '<td></td>';
        html += '</tr>'; return;
      }
      if (row.type === 'carry') {
        const bgColor = interactive && partialIdx < partialColors.length ? partialColors[partialIdx] : '';
        const bgStyle = bgColor ? ` style="background:${bgColor}0D"` : '';
        html += `<tr class="carry-row" id="workingCarry${partialIdx}"${bgStyle}><td class="op-cell"></td>`;
        for (let c = 0; c < numCols; c++) {
          const v = row.digits[c];
          if (interactive && v != null && v !== 0) {
            html += `<td><span class="carry-val" id="carry_${partialIdx}_${c}">${v}</span></td>`;
          } else {
            html += `<td>${v != null && v !== 0 ? v : ''}</td>`;
          }
        }
        html += '</tr>'; return;
      }
      const isPartial = row.type === 'partial';
      const isResult = row.type === 'result';
      const isMultiplier = row.type === 'number' && row.op === '×';

      if (interactive && isMultiplier) {
        // Multiplier row: color-code each digit with a badge
        html += `<tr><td class="op-cell">${row.op}</td>`;
        for (let c = 0; c < numCols; c++) {
          const v = row.digits[c];
          if (v == null) {
            html += '<td class="dim">·</td>';
          } else {
            // Find which partial index this column corresponds to
            const pIdx = numCols - 1 - c;
            const color = pIdx < partialColors.length ? partialColors[pIdx] : '#888';
            html += `<td><span class="digit-badge" id="bDigit${pIdx}" style="background:${color}">${v}</span></td>`;
          }
        }
        html += '</tr>';
      } else if (interactive && (isPartial || isResult)) {
        const rowName = isPartial ? `partial${partialIdx}` : 'result';
        const trId = isPartial ? `workingPartial${partialIdx}` : 'workingResultRow';
        const color = isPartial ? partialColors[partialIdx] : '#27ae60';
        if (isPartial) partialIdx++;
        const cls = isResult ? 'result-row' : 'partial-row';
        const disabled = isResult ? ' disabled' : '';
        // Op cell: colored dot for partial rows to match the multiplier digit
        const opContent = isPartial
          ? `<span class="partial-dot" style="background:${color}"></span>${row.op || ''}`
          : (row.op || '');
        const rowBg = isPartial ? ` style="background:${color}12"` : '';
        html += `<tr class="${cls}" id="${trId}"${rowBg}><td class="op-cell">${opContent}</td>`;
        for (let c = 0; c < numCols; c++) {
          const v = row.digits[c];
          if (v == null) {
            html += '<td class="dim">·</td>';
          } else {
            html += `<td class="input-cell"><input class="digit-input" type="text" inputmode="numeric" maxlength="1" data-answer="${v}" data-row="${rowName}" data-col="${c}" autocomplete="off"${disabled}></td>`;
          }
        }
        html += '</tr>';
      } else {
        const cls = isResult ? 'result-row' : isPartial ? 'partial-row' : '';
        html += `<tr class="${cls}"><td class="op-cell">${row.op || ''}</td>`;
        for (let c = 0; c < numCols; c++) {
          const v = row.digits[c];
          html += `<td class="${v == null ? 'dim' : ''}">${v != null ? v : '·'}</td>`;
        }
        html += '</tr>';
      }
    });
    html += '</table>';
    return html;
  }

  function numToDigitRow(n, op, type) {
    const s = String(n);
    const digits = new Array(numCols).fill(null);
    for (let i = 0; i < s.length; i++) digits[numCols - s.length + i] = s[i];
    return { type: type || 'number', op, digits };
  }

  const partialInfos = [];
  for (let i = bStr.length - 1; i >= 0; i--) {
    const bDigit = parseInt(bStr[i]);
    const shift = bStr.length - 1 - i;
    const partialVal = a * bDigit;
    const fullVal = partialVal * Math.pow(10, shift);
    const aDigits = aStr.split('').map(Number);
    let carry = 0;
    const digitSteps = [];
    for (let j = aDigits.length - 1; j >= 0; j--) {
      const prod = aDigits[j] * bDigit + carry;
      const write = prod % 10;
      const newCarry = Math.floor(prod / 10);
      digitSteps.unshift({ aDigit: aDigits[j], bDigit, carry, prod, write, newCarry });
      carry = newCarry;
    }
    if (carry > 0) digitSteps.unshift({ aDigit: null, bDigit, carry: 0, prod: carry, write: carry, newCarry: 0, isFinalCarry: true });
    const carryRow = new Array(numCols).fill(null);
    let c2 = 0;
    for (let j = aDigits.length - 1; j >= 0; j--) {
      const prod = aDigits[j] * bDigit + c2;
      c2 = Math.floor(prod / 10);
      const col = numCols - shift - (aStr.length - j) - 1;
      if (c2 > 0 && col >= 0) carryRow[col] = c2;
    }
    partialInfos.push({ bDigit, shift, partialVal, fullVal, digitSteps, carryRow });
  }

  const tableRows = [numToDigitRow(a, '', 'number'), numToDigitRow(b, '×', 'number'), { type: 'sep' }];
  partialInfos.forEach(info => {
    if (isMultiDigit) tableRows.push({ type: 'carry', digits: info.carryRow });
    tableRows.push(numToDigitRow(info.fullVal, isMultiDigit ? '+' : '', 'partial'));
  });
  if (isMultiDigit) {
    tableRows.push({ type: 'sep', sepId: 'workingFinalSep' });
    // Compute carry row for the final addition of partial products
    const resultCarry = new Array(numCols).fill(null);
    let addCarry = 0;
    for (let c = numCols - 1; c >= 0; c--) {
      let colSum = addCarry;
      partialInfos.forEach(info => {
        const s = String(info.fullVal);
        const digits = new Array(numCols).fill(0);
        for (let i = 0; i < s.length; i++) digits[numCols - s.length + i] = parseInt(s[i]);
        colSum += digits[c];
      });
      addCarry = Math.floor(colSum / 10);
      if (addCarry > 0 && c > 0) resultCarry[c - 1] = addCarry;
    }
    tableRows.push({ type: 'carry', digits: resultCarry });
    tableRows.push(numToDigitRow(total, '', 'result'));
  }

  const placeNames = t('placeNames');
  let html = '<div class="mult-workings">';
  // Column method content (no description text)
  html += makeColTable(tableRows, isMultiDigit);

  if (!isMultiDigit) {
    // Step explanation sections for single-digit multiplier (non-interactive)
    partialInfos.forEach((info, idx) => {
      const stepColor = '#e74c3c';
      html += `<div class="step-section" style="border-left-color:${stepColor}"><div class="step-title"><span class="partial-dot" style="background:${stepColor}"></span> ${t('step')} ${idx+1}: ${a} × ${info.bDigit}</div>`;
      html += '<div>';
      if (info.bDigit === 0) {
        html += `<div class="digit-steps"><div class="digit-step">${t('anythingTimesZero')}</div></div>`;
      } else {
        html += `<div class="digit-steps">`;
        info.digitSteps.forEach(s => {
          if (s.isFinalCarry) { html += `<div class="digit-step">  ${t('finalCarry')} <strong>${s.write}</strong></div>`; return; }
          let line = `${s.aDigit} × ${s.bDigit}`;
          if (s.carry > 0) line += ` + <span class="carry-num">${s.carry}</span> (${t('carry')})`;
          line += ` = ${s.prod}`;
          if (s.newCarry > 0) line += `  →  write <strong>${s.write}</strong>, ${t('carry')} <span class="carry-num">${s.newCarry}</span>`;
          else line += `  →  write <strong>${s.write}</strong>`;
          html += `<div class="digit-step">• ${line}</div>`;
        });
        html += '</div>';
      }
      const fullStr = String(info.fullVal);
      html += `<div class="partial-result">${t('result')}: <strong>${fullStr}</strong></div></div></div>`;
    });
  }

  html += '</div>';

  // Attach event listeners after DOM insertion (via setTimeout)
  if (isMultiDigit) {
    setTimeout(() => {
      document.querySelectorAll('.digit-input').forEach(inp => {
        inp.addEventListener('input', function() { checkDigit(this); });
        inp.addEventListener('keydown', function(e) {
          // Allow Backspace to move to previous input
          if (e.key === 'Backspace' && !this.value) {
            const allInRow = Array.from(this.closest('tr').querySelectorAll('.digit-input:not([disabled])'));
            const idx = allInRow.indexOf(this);
            if (idx > 0) { allInRow[idx - 1].readOnly = false; allInRow[idx - 1].classList.remove('correct'); allInRow[idx - 1].value = ''; allInRow[idx - 1].focus(); }
          }
        });
      });
      // Set initial focus + pulsing glow on the first input to fill
      updateNextFocus();
    }, 0);
  }

  return html;
}

function updateNextFocus() {
  // Remove pulsing glow from all inputs
  document.querySelectorAll('.digit-input.next-focus').forEach(i => i.classList.remove('next-focus'));
  // Find the first enabled, non-readonly, non-correct input in partial rows (top to bottom, right to left)
  const partialRows = document.querySelectorAll('tr[id^="workingPartial"]');
  for (const row of partialRows) {
    const inputs = Array.from(row.querySelectorAll('.digit-input'));
    // Right-to-left: find rightmost unfilled
    for (let i = inputs.length - 1; i >= 0; i--) {
      if (!inputs[i].readOnly && !inputs[i].disabled && !inputs[i].classList.contains('correct')) {
        inputs[i].classList.add('next-focus');
        inputs[i].focus();
        return;
      }
    }
  }
  // If all partials done, focus first result input
  const resultRow = document.getElementById('workingResultRow');
  if (resultRow) {
    const inputs = Array.from(resultRow.querySelectorAll('.digit-input'));
    for (let i = inputs.length - 1; i >= 0; i--) {
      if (!inputs[i].readOnly && !inputs[i].disabled && !inputs[i].classList.contains('correct')) {
        inputs[i].classList.add('next-focus');
        inputs[i].focus();
        return;
      }
    }
  }
}

function spawnDigitCheck(el) {
  const rect = el.getBoundingClientRect();
  const check = document.createElement('div');
  check.textContent = '✓';
  check.style.cssText = `position:fixed;z-index:10000;pointer-events:none;
    font-size:1.2em;font-weight:900;color:#27ae60;
    left:${rect.left + rect.width/2 - 8}px;top:${rect.top - 4}px;
    transition:all 0.6s ease-out;opacity:1`;
  document.body.appendChild(check);
  requestAnimationFrame(() => {
    check.style.top = (rect.top - 28) + 'px';
    check.style.opacity = '0';
    check.style.transform = 'scale(1.3)';
  });
  setTimeout(() => check.remove(), 650);
}

function spawnRowCelebration(rowEl) {
  const rect = rowEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const emojis = ['✨','⭐','🌟','💫','✅'];
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'star-burst';
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.fontSize = '1.2em';
    const angle = (i / 6) * Math.PI * 2;
    const dist = 40 + Math.random() * 40;
    const dist2 = dist + 30;
    s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    s.style.setProperty('--dx2', Math.cos(angle) * dist2 + 'px');
    s.style.setProperty('--dy2', Math.sin(angle) * dist2 - 20 + 'px');
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.animationDelay = Math.random() * 0.15 + 's';
    s.style.animationDuration = '0.8s';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
  // "Nice!" text bubble
  const nice = document.createElement('div');
  nice.className = 'celebration-text';
  nice.style.cssText = `font-size:1.8em;top:${cy}px;left:${cx}px`;
  const phrases = ['Nice!', 'Got it!', 'Yes!', '👏', '💪'];
  nice.textContent = phrases[Math.floor(Math.random() * phrases.length)];
  document.body.appendChild(nice);
  setTimeout(() => nice.remove(), 1000);
}

function checkDigit(el) {
  const val = el.value.trim();
  if (!val) return;
  const expected = el.dataset.answer;

  if (val === expected) {
    el.classList.remove('wrong', 'shake');
    el.classList.add('correct');
    el.classList.add('digit-pop');
    el.readOnly = true;
    // Floating checkmark
    spawnDigitCheck(el);
    // Reveal the carry for the column to the LEFT of the just-entered digit
    const rowName = el.dataset.row;
    const col = parseInt(el.dataset.col);
    if (rowName && rowName.startsWith('partial')) {
      const idx = parseInt(rowName.replace('partial', ''));
      const carryCell = document.getElementById('carry_' + idx + '_' + (col - 1));
      if (carryCell) carryCell.classList.add('visible');
    } else if (rowName === 'result') {
      const numPartials = document.querySelectorAll('tr[id^="workingPartial"]').length;
      const carryCell = document.getElementById('carry_' + numPartials + '_' + (col - 1));
      if (carryCell) carryCell.classList.add('visible');
    }
    // Auto-advance: prefer left (like on paper), then right
    const tr = el.closest('tr');
    const allInRow = Array.from(tr.querySelectorAll('.digit-input'));
    const myIdx = allInRow.indexOf(el);
    let nextInput = null;
    for (let i = myIdx - 1; i >= 0; i--) {
      if (!allInRow[i].readOnly && !allInRow[i].disabled) { nextInput = allInRow[i]; break; }
    }
    if (!nextInput) {
      for (let i = myIdx + 1; i < allInRow.length; i++) {
        if (!allInRow[i].readOnly && !allInRow[i].disabled) { nextInput = allInRow[i]; break; }
      }
    }
    if (nextInput) {
      nextInput.focus();
    } else {
      // Row complete — check if all inputs in this row are correct
      const rowName = el.dataset.row;
      const allCorrect = allInRow.every(inp => inp.classList.contains('correct'));
      if (allCorrect) onRowComplete(rowName);
    }
    updateNextFocus();
  } else {
    el.classList.remove('correct');
    el.classList.add('wrong');
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
    setTimeout(() => { el.value = ''; el.classList.remove('wrong'); }, 600);
  }
}

function onRowComplete(rowName) {
  if (rowName.startsWith('partial')) {
    const idx = parseInt(rowName.replace('partial', ''));
    // Mark row visually complete with celebration
    const row = document.getElementById('workingPartial' + idx);
    if (row) {
      row.classList.add('row-complete');
      spawnRowCelebration(row);
    }

    // Check if all partial rows are done
    const allPartialInputs = document.querySelectorAll('.digit-input[data-row^="partial"]');
    const allPartialsDone = Array.from(allPartialInputs).every(inp => inp.classList.contains('correct'));
    if (allPartialsDone) {
      // Enable result row and reveal final separator
      const sep = document.getElementById('workingFinalSep');
      if (sep) { sep.classList.remove('hidden-row'); sep.classList.add('revealed-row'); }
      const resultInputs = document.querySelectorAll('.digit-input[data-row="result"]');
      resultInputs.forEach(inp => { inp.disabled = false; });
      // Focus first result input (right to left)
      updateNextFocus();
    }
  } else if (rowName === 'result') {
    const row = document.getElementById('workingResultRow');
    if (row) {
      row.classList.add('row-complete');
      spawnRowCelebration(row);
    }
    const label = document.getElementById('workingFinalLabel');
    if (label) { label.textContent = '✓ ' + t('allStepsSolved'); label.style.color = '#27ae60'; }
    // Move cursor to the main answer input so the user can type the final answer
    setTimeout(() => {
      const ansInput = document.getElementById('answerInput');
      if (ansInput && !ansInput.readOnly) {
        ansInput.focus();
        ansInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 300);
  }
}

/* ───────── DIVISION ───────── */
function renderDivision(total, divisor) {
  const quotient = Math.floor(total / divisor);
  const remainder = total % divisor;
  document.getElementById('equation').textContent =
    `${total} ÷ ${divisor} = ?` + (remainder ? ' ' + t('justQuotient') : '');
  document.getElementById('answerBox').textContent =
    `= ${quotient}` + (remainder ? ` ${t('remainder')} ${remainder}` : '');

  // Division: hide method picker, show break content for apple visuals, show div workings card
  document.getElementById('methodPicker').style.display = 'none';
  document.getElementById('methodBreakContent').style.display = '';
  document.getElementById('methodColumnContent').style.display = 'none';
  document.getElementById('divWorkingsCard').style.display = '';

  const container = document.getElementById('groupsContainer');
  container.innerHTML = '';
  const showPiles = Math.min(quotient, 12);
  const pluralS = quotient !== 1 ? 's' : '';
  const pluralSv = quotient !== 1 ? 'er' : '';
  let vizTitle = t('sharedIntoGroups')
    .replace('{total}', total).replace('{divisor}', divisor)
    .replace('{quotient}', quotient).replace('{s}', pluralS).replace('{s_sv}', pluralSv);
  if (remainder) vizTitle += t('plusLeftover').replace('{n}', remainder);
  document.getElementById('visualTitle').textContent = vizTitle;

  if (quotient <= 60 && divisor <= 20 && total <= 200) {
    for (let g = 0; g < showPiles; g++) {
      const div = document.createElement('div');
      div.className = 'group';
      for (let i = 0; i < divisor; i++) {
        const s = document.createElement('span');
        s.className = 'item'; s.textContent = '🍎';
        div.appendChild(s);
      }
      container.appendChild(div);
    }
    if (quotient > showPiles) {
      const more = document.createElement('div');
      more.className = 'too-many';
      const n = quotient - showPiles;
      more.textContent = t('moreGroups').replace('{n}', n).replace('{s}', n>1?'s':'').replace('{s_sv}', n>1?'er':'');
      container.appendChild(more);
    }
    if (remainder > 0) {
      const rem = document.createElement('div');
      rem.className = 'group';
      rem.style.cssText = 'border-color:#f39c12;background:#fff8e1;';
      for (let i = 0; i < remainder; i++) {
        const s = document.createElement('span');
        s.className = 'item'; s.textContent = '🍊';
        rem.appendChild(s);
      }
      const lbl = document.createElement('div');
      lbl.style.cssText = 'font-size:0.65em;color:#f39c12;width:100%;text-align:center;margin-top:2px;font-weight:bold';
      lbl.textContent = t('leftover');
      rem.appendChild(lbl);
      container.appendChild(rem);
    }
  } else {
    container.innerHTML = `<div class="too-many">${t('tooMany')}</div>`;
  }

  document.getElementById('divWorkings').innerHTML = buildDivWorkings(total, divisor);
  // Reapply toggle state
  if (document.getElementById('stepsToggle').checked)
    document.getElementById('stepsArea').classList.add('visible');
}

function buildDivWorkings(dividend, divisor) {
  const quotient = Math.floor(dividend / divisor);
  const remainder = dividend % divisor;
  const remNote = remainder > 0 ? `  ${t('remainder')} ${remainder}` : '';

  // Simple case: single-step division (dividend < 100 or only one meaningful step)
  if (String(dividend).length <= String(divisor).length + 1 && dividend < 100) {
    let html = '<div class="div-workings">';
    html += `<span class="step">  ${dividend} ÷ ${divisor} = ${quotient}`;
    html += `   (${t('because')} ${quotient} × ${divisor} = ${quotient * divisor})</span>\n`;
    if (remainder > 0) {
      html += `<span class="step">  ${dividend} − ${quotient * divisor} = ${remainder} ${t('leftOverText')}</span>\n`;
    }
    html += `\n<span class="result-line">  ${dividend} ÷ ${divisor}  =  <strong>${quotient}</strong>${remNote}</span>`;
    html += '</div>';
    return html;
  }

  // Full long division for larger numbers
  const dividendStr = String(dividend);
  let current = 0;
  let quotientStr = '';
  const steps = [];
  for (let i = 0; i < dividendStr.length; i++) {
    current = current * 10 + parseInt(dividendStr[i]);
    const q = Math.floor(current / divisor);
    const rem = current % divisor;
    quotientStr += String(q);
    steps.push({ current, q, subtract: q * divisor, rem });
    current = rem;
  }
  const cleanQ = parseInt(quotientStr);
  const finalRem = steps[steps.length - 1].rem;
  const dLen = dividendStr.length;
  const sep = '─'.repeat(dLen + String(divisor).length + 5);
  let lines = [];
  lines.push(`<span class="step">  ${dividendStr} / ${divisor}</span>`);
  lines.push(`<span class="line-sep">  ${sep}</span>`);
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    const indent = '       ' + ' '.repeat(i * 2);
    if (s.current < divisor && s.q === 0 && i < steps.length - 1) {
      lines.push(`<span class="step">${indent}${s.current}  ${t('lessThan').replace('{divisor}', divisor)}</span>`);
    } else {
      lines.push(`<span class="step">${indent}${s.current}  ÷  ${divisor}  =  ${s.q}   (${t('since')} ${s.q} × ${divisor} = ${s.subtract})</span>`);
      lines.push(`<span class="step">${indent}${s.current} − ${s.subtract} = ${s.rem}</span>`);
    }
  }
  lines.push('');
  lines.push(`<span class="line-sep">  ${sep}</span>`);
  const finalRemNote = finalRem > 0 ? `  ${t('remainder')} ${finalRem}` : '';
  lines.push(`<span class="result-line">  ${dividend} ÷ ${divisor}  =  <strong>${cleanQ}</strong>${finalRemNote}</span>`);
  return `<div class="div-workings">${lines.join('\n')}</div>`;
}

/* ───────── CELEBRATION ───────── */
let lastCelebrationIdx = -1;
function launchCelebration() {
  // Pick a random celebration, avoiding repeats
  let idx;
  do { idx = Math.floor(Math.random() * celebrations.length); } while (idx === lastCelebrationIdx && celebrations.length > 1);
  lastCelebrationIdx = idx;
  celebrations[idx]();
}

// Shared helpers
const celebColors = ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#ff6b81'];
function tmpEl(cls, text, duration) {
  const el = document.createElement('div');
  el.className = cls;
  if (text) el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), duration);
  return el;
}
function celebText(msg) {
  if (!msg) {
    const phrases = t('correct');
    msg = Array.isArray(phrases) ? phrases[Math.floor(Math.random() * phrases.length)] : phrases;
  }
  tmpEl('celebration-text', msg, 1500);
}

function showStarBurst(emojis, count) {
  for (let i = 0; i < count; i++) {

    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.animationDelay = Math.random() * 0.3 + 's';
  }
}
